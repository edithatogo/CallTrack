plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.markobl.calllogsync'
    compileSdk 36
    buildFeatures { compose true }

    defaultConfig {
        applicationId "org.calltrack.community.dev"
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName "0.1.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation project(':shared-core')
    implementation platform('androidx.compose:compose-bom:2026.03.00')
    implementation 'androidx.activity:activity:1.7.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'androidx.appcompat:appcompat:1.4.1'
    implementation 'com.google.android.material:material:1.5.0'
    // These remain Material/AppCompat transitives after legacy screens are removed.
    // Preserve qualified selections without restoring unused direct API dependencies.
    constraints {
        implementation('androidx.constraintlayout:constraintlayout:2.1.3') {
            because 'Retain the qualified transitive version during Kotlin migration'
        }
        implementation('androidx.recyclerview:recyclerview:1.2.1') {
            because 'Retain the qualified transitive version during Kotlin migration'
        }
        implementation('androidx.transition:transition:1.4.1') {
            because 'Retain the qualified transitive version during Kotlin migration'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.03.00')
    androidTestImplementation 'androidx.test.ext:junit:1.1.3'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Interim compatibility decisions from Track 2.
dependencies { implementation 'androidx.fragment:fragment:1.5.1'; implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.5.1' }

// Match the Java bytecode target; retain JDK17 as the build runtime.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}
