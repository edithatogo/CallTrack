plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp' version '2.3.14'
}

def developmentRelease = providers.gradleProperty('calltrackDevelopmentRelease').orElse('false').get() == 'true'

android {
    namespace 'com.markobl.calllogsync'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }
    buildFeatures { compose true }

    defaultConfig {
        applicationId "org.calltrack.community.dev"
        manifestPlaceholders.calltrackAppLabel = "@string/app_name"
        minSdk 37
        targetSdk 37
        versionCode 13
        versionName "0.1.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            if (!developmentRelease) {
                manifestPlaceholders.calltrackAppLabel = "@string/release_app_name"
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

androidComponents {
    if (!developmentRelease) {
        onVariants(selector().withBuildType('release')) { variant ->
            variant.applicationId.set('io.github.edithatogo.calltrack')
            variant.outputs.each { output ->
                output.versionCode.set(1)
                output.versionName.set('0.1.0')
            }
        }
    }
}

dependencies {
    // Room 3 owns both existing on-disk databases.
    implementation 'androidx.room3:room3-runtime:3.0.3'
    implementation 'androidx.sqlite:sqlite-framework:2.7.1'
    ksp 'androidx.room3:room3-compiler:3.0.3'
    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material3:material3'
    implementation "androidx.work:work-runtime:2.12.0"
    constraints {
        implementation('androidx.lifecycle:lifecycle-runtime:2.11.1') {
            because 'Keep the qualified Lifecycle family selected for Activity, Compose and WorkManager'
        }
        implementation('androidx.tracing:tracing:2.0.5') {
            because 'Keep the qualified Tracing version selected for Activity and WorkManager'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.11.01')
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Keep Android Java and Kotlin bytecode targets aligned.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

// Room schema JSON is an auditable, versioned migration contract.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}
