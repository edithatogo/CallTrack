plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp' version '2.3.14'
}

android {
    namespace 'com.markobl.calllogsync'
    compileSdk {
        version = release(37) {
            minorApiLevel = 1
        }
    }
    buildFeatures { compose true }

    defaultConfig {
        applicationId "org.calltrack.community.dev"
        minSdk 37
        targetSdk 37
        versionCode 10
        versionName "0.1.0-dev"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Room 3 owns both existing on-disk databases. The SQLite wrapper is a
    // temporary, official migration bridge for the proven receipt state machine.
    implementation 'androidx.room3:room3-runtime:3.0.3'
    implementation 'androidx.sqlite:sqlite-framework:2.7.1'
    ksp 'androidx.room3:room3-compiler:3.0.3'
    implementation platform('androidx.compose:compose-bom:2026.11.01')
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation "androidx.work:work-runtime:2.12.0"
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.fragment:fragment:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.1'
    // These remain Material/AppCompat transitives after legacy screens are removed.
    // Select their versions without restoring unused direct API dependencies.
    constraints {
        implementation('androidx.constraintlayout:constraintlayout:2.2.2') {
            because 'Keep the selected transitive AndroidX version'
        }
        implementation('androidx.recyclerview:recyclerview:1.4.0') {
            because 'Keep the selected transitive AndroidX version'
        }
        implementation('androidx.transition:transition:1.7.2') {
            because 'Keep the selected transitive AndroidX version'
        }
    }
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.11.01')
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
// Keep Android Java and Kotlin bytecode targets aligned.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

// Room schema JSON is an auditable, versioned migration contract.
ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}
