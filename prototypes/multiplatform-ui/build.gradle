buildscript {
    dependencies {
        constraints {
            classpath('com.google.guava:guava:33.8.0-jre')
            classpath('org.apache.commons:commons-lang3:3.22.0')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
            classpath('org.bouncycastle:bcprov-jdk18on:1.87')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.87')
            classpath('org.bouncycastle:bcutil-jdk18on:1.87')
            classpath('org.jdom:jdom2:2.0.6.1')
        }
    }
}
plugins {
    alias(libs.plugins.kotlin.multiplatform)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.compose.multiplatform)
    alias(libs.plugins.android.multiplatform)
    alias(libs.plugins.android.application) apply false
}
kotlin {
    jvmToolchain(25)
    android {
        namespace = 'org.calltrack.companion.shared'
        compileSdk 37
        minSdk 26
        withHostTest {}
        compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
    jvm('desktop') {
        compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
    sourceSets {
        commonMain.dependencies {
            api compose.runtime
            api compose.foundation
            api libs.multiplatform.material3
        }
        commonTest.dependencies { implementation kotlin('test') }
        desktopMain.dependencies { implementation compose.desktop.currentOs }
        desktopTest.dependencies {
            implementation kotlin('test-junit')
            implementation 'junit:junit:4.13.2'
            implementation compose.desktop.uiTestJUnit4
        }
    }
}

compose.desktop {
    application { mainClass = 'org.calltrack.companion.MainKt' }
}
dependencies {
    constraints {
        add('desktopTestImplementation', 'com.google.guava:guava:33.8.0-jre') {
            because 'Use the patched Guava with the desktop test library'
        }
    }
}
tasks.withType(Test).configureEach {
    maxParallelForks = 1
    // Offscreen desktop renderer: no window or user desktop interaction is needed.
    systemProperty 'java.awt.headless', 'true'
}

tasks.named('desktopTest', Test) {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
