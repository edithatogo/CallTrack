plugins {
    id 'org.jetbrains.kotlin.multiplatform' version '2.4.21'
    id 'org.jetbrains.kotlin.plugin.compose' version '2.4.21'
    // 1.12.x requires API 37.1 / AGP 9.1; keep this Android-host prototype
    // buildable on the qualified API 36 / AGP 8.13 toolchain.
    id 'org.jetbrains.compose' version '1.10.3'
    id 'com.android.kotlin.multiplatform.library' version '8.13.2'
    id 'com.android.application' version '8.13.2' apply false
    id 'org.jetbrains.kotlin.android' version '2.4.21' apply false
}
kotlin {
    jvmToolchain(17)
    android {
        namespace 'org.calltrack.companion.shared'
        compileSdk 36
        minSdk 26
    }
    jvm('desktop')
    sourceSets {
        commonMain.dependencies {
            api compose.runtime
            api compose.foundation
            api compose.material
        }
        commonTest.dependencies { implementation kotlin('test') }
        desktopMain.dependencies { implementation compose.desktop.currentOs }
        desktopTest.dependencies {
            implementation kotlin('test-junit')
            implementation 'junit:junit:4.13.2'
            implementation compose.desktop.uiTestJUnit4
        }
    }
}

compose.desktop {
    application { mainClass = 'org.calltrack.companion.MainKt' }
}
tasks.withType(Test).configureEach {
    maxParallelForks = 1
    // Offscreen desktop renderer: no window or user desktop interaction is needed.
    systemProperty 'java.awt.headless', 'true'
}
