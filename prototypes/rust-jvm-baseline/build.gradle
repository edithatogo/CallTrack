plugins {
    alias(libs.plugins.kotlin.jvm)
    id 'application'
}
kotlin {
    jvmToolchain(25)
    compilerOptions.jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    sourceSets.main.kotlin {
        srcDirs '../../app/src/main/kotlin', 'src/main/kotlin'
        include 'com/markobl/calllogsync/slice/CallIdentity.kt',
                'com/markobl/calllogsync/slice/CallRecord.kt',
                'org/calltrack/benchmark/Main.kt'
    }
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
application { mainClass = 'org.calltrack.benchmark.MainKt' }
