// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Minimum patched versions for build-time transitives; newer selections remain allowed.
        constraints {
            classpath('com.google.guava:guava:33.8.0-jre')
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
            classpath('org.bouncycastle:bcprov-jdk18on:1.87')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.87')
            classpath('org.bouncycastle:bcutil-jdk18on:1.87')
            classpath('org.jdom:jdom2:2.0.6.1')
        }
        classpath libs.android.gradle
        classpath libs.kotlin.gradle
        classpath libs.kotlin.compose.compiler
        classpath libs.kotlin.serialization

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

plugins {
    id 'jvm-toolchains'
    alias(libs.plugins.detekt) apply false
}

configurations {
    ktfmtCli {
        canBeConsumed = false
        transitive = false
    }
    detektCoreCli {
        canBeConsumed = false
        transitive = false
    }
    detektCli { canBeConsumed = false }
    detektPlugins { canBeConsumed = false }
    ktlintCli {
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    ktfmtCli(variantOf(libs.ktfmt) { classifier('with-dependencies') })
    detektCoreCli(variantOf(libs.detekt.core.cli) { classifier('all') })
    ktlintCli 'com.pinterest.ktlint:ktlint-cli:1.8.0:all@jar'
    detektCli libs.detekt.cli
    detektPlugins libs.detekt.compose
    detektPlugins libs.detekt.formatting
}

// IntelliJ's parsers in these CLI tools use an Unsafe API deprecated in JDK 24.
def analysisJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }

tasks.register('ktlintCheck', JavaExec) {
    javaLauncher.set(analysisJava)
    group = 'verification'
    description = 'Run ktlint against Android Kotlin sources.'
    classpath = configurations.ktlintCli
    mainClass = 'com.pinterest.ktlint.Main'
    args '--relative', 'app/src/**/*.kt'
}

tasks.register('ktfmtCheck', JavaExec) {
    group = 'verification'
    classpath = configurations.ktfmtCli
    mainClass = 'org.jetbrains.kotlinx.ktfmt.cli.Main'
    args '--kotlinlang-style', '--dry-run', '--set-exit-if-changed'
    args fileTree('app/src') { include '**/*.kt' }.files.sort()
}

tasks.register('detektCore', JavaExec) {
    javaLauncher.set(analysisJava)
    group = 'verification'
    classpath = configurations.detektCoreCli
    mainClass = 'dev.detekt.cli.Main'
    args '--input', 'app/src', '--base-path', projectDir.absolutePath,
        '--config', file('config/detekt/core.yml').absolutePath, '--build-upon-default-config'
}

// The stable plugin's apply() calls deprecated Gradle 9 APIs. Its verification task
// accepts the same rule sets without registering the obsolete configurations.
tasks.register('detekt', io.gitlab.arturbosch.detekt.Detekt) {
    dependsOn 'detektCore', 'ktfmtCheck', 'ktlintCheck'
    // detektCore owns general rules. Load the Compose and formatting rule sets here.
    disableDefaultRuleSets = true
    detektClasspath.from(configurations.detektCli)
    pluginClasspath.from(configurations.detektPlugins)
    setSource(fileTree('app/src') { include '**/*.kt' })
    inputs.file('.editorconfig')
    reports.xml.required.set(true)
    config.setFrom(files('config/detekt/detekt.yml'))
    buildUponDefaultConfig = true
    allRules = false
    autoCorrect = false
    basePath = rootDir.absolutePath
}

// AGP resolves the lint engine in detached project configurations, separately
// from the buildscript classpath. Keep its vulnerable transitives patched too.
allprojects {
    dependencies {
        components {
            withModule('com.android.tools.lint:lint-gradle') {
                allVariants {
                    withDependencyConstraints {
                        add('com.google.guava:guava:33.8.0-jre')
                        add('org.apache.commons:commons-lang3:3.22.0')
                        add('org.apache.httpcomponents:httpclient:4.5.14')
                        add('org.apache.httpcomponents:httpmime:4.5.14')
                        add('org.bouncycastle:bcprov-jdk18on:1.87')
                        add('org.bouncycastle:bcpkix-jdk18on:1.87')
                        add('org.bouncycastle:bcutil-jdk18on:1.87')
                    }
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
