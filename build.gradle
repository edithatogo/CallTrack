// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Minimum patched versions for build-time transitives; newer selections remain allowed.
        classpath platform('io.netty:netty-bom:4.1.141.Final')
        constraints {
            classpath('com.google.guava:guava:33.8.0-jre')
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
            classpath('org.bouncycastle:bcprov-jdk18on:1.87')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.87')
            classpath('org.bouncycastle:bcutil-jdk18on:1.87')
            classpath('org.jdom:jdom2:2.0.6.1')
        }
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21'
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
