name: Shared core Kotlin/Native
on:
  push:
    paths:
      - '.github/workflows/shared-core-native.yml'
      - 'shared-core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
  pull_request:
    paths:
      - '.github/workflows/shared-core-native.yml'
      - 'shared-core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21+100000002'
      - name: Select and verify the pinned Kotlin/Native Xcode toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_26.1.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.1.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17B100'
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          java -version
          xcode-select -p
          xcodebuild -version
          sw_vers
      - name: Run common fixtures on macOS ARM64
        run: sh gradlew --no-daemon --console=plain :shared-core:macosArm64Test
      - name: Verify Kotlin/Native test reports
        if: always()
        run: |
          result_dir=shared-core/build/test-results/macosArm64Test
          if [ -d "$result_dir" ]; then
            reports=$(find "$result_dir" -type f -name '*.xml' -print)
            test -n "$reports" || { echo 'No Kotlin/Native JUnit XML report was produced.'; exit 1; }
            printf '%s\n' "$reports"
            summaries=$(find "$result_dir" -type f -name '*.xml' -exec grep -h '<testsuite' {} +)
            printf '%s\n' "$summaries"
            printf '%s\n' "$summaries" | grep -Eq 'tests="[1-9][0-9]*"' || { echo 'JUnit reports contain no executed tests.'; exit 1; }
            if printf '%s\n' "$summaries" | grep -Eq '(skipped|failures|errors)="[1-9][0-9]*"'; then
              echo 'Kotlin/Native JUnit reports contain skipped or failing tests.'
              exit 1
            fi
          else
            echo 'Kotlin/Native test report directory was not produced.'
            exit 1
          fi
