name: Shared core Kotlin/Native
on:
  push:
    paths:
      - '.github/workflows/shared-core-native.yml'
      - 'shared-core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
  pull_request:
    paths:
      - '.github/workflows/shared-core-native.yml'
      - 'shared-core/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'build.gradle'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.20+101'
      - name: Select and verify the pinned Kotlin/Native Xcode toolchain
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select --switch /Applications/Xcode_26.1.1.app/Contents/Developer
          test "$(xcodebuild -version | sed -n '1p')" = 'Xcode 26.1.1'
          test "$(xcodebuild -version | sed -n '2p')" = 'Build version 17B100'
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          java -version
          xcode-select -p
          xcodebuild -version
          sw_vers
      - name: Run common fixtures on macOS ARM64
        run: sh gradlew --no-daemon --console=plain :shared-core:macosArm64Test
      - name: Verify Kotlin/Native test reports
        if: always()
        run: |
          result_dir=shared-core/build/test-results/macosArm64Test
          if [ -d "$result_dir" ]; then
            reports=$(find "$result_dir" -type f -name '*.xml' -print)
            test -n "$reports" || { echo 'No Kotlin/Native JUnit XML report was produced.'; exit 1; }
            printf '%s\n' "$reports"
            find "$result_dir" -type f -name '*.xml' -exec grep -h '<testsuite' {} +
          else
            echo 'Kotlin/Native test report directory was not produced.'
            exit 1
          fi
