name: Call-data fuzzing
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '7 2 * * 6'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jazzer-call-data:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21+100000002'
      - name: Install verified Jazzer
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            https://github.com/CodeIntelligenceTesting/jazzer/releases/download/v0.30.0/jazzer-linux-x86-64.tar.gz \
            -o "$RUNNER_TEMP/jazzer.tar.gz"
          echo '6eeaf0026d75599b07527d93b576593ce847cfca8b337a579971a5a9cdf792d0  '"$RUNNER_TEMP/jazzer.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/jazzer"
          tar -xzf "$RUNNER_TEMP/jazzer.tar.gz" -C "$RUNNER_TEMP/jazzer"
      - name: Fuzz call data and import ranges
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/fuzz-gradle
          FUZZ_OUTPUT_DIR: ${{ runner.temp }}/calltrack-fuzz
          JAZZER_HOME: ${{ runner.temp }}/jazzer
        run: sh fuzz/run-jazzer.sh
      - name: Retain a failing input and reproducer
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: call-data-fuzz-failure
          path: |
            ${{ runner.temp }}/calltrack-fuzz/run.*/crash-*
            ${{ runner.temp }}/calltrack-fuzz/run.*/Crash_*.java
          if-no-files-found: warn
          retention-days: 14
