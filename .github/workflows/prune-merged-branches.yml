name: Prune merged feature branches
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  prune:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only the merged repository branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          ref="repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
          if gh api --silent "$ref" >/dev/null 2>&1; then
            gh api --method DELETE "$ref"
            echo "Pruned merged branch"
          else
            echo "Branch already absent; nothing to prune"
          fi
