name: Prune merged feature branches
on:
  pull_request:
    types: [closed]
permissions:
  contents: write
jobs:
  prune:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: Remove only the merged branch tip
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          ref="refs/heads/$HEAD_REF"
          git check-ref-format "$ref"
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          repo="$RUNNER_TEMP/merged-branch.git"
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git init --quiet --bare "$repo"
          git -C "$repo" config "credential.$GITHUB_SERVER_URL.helper" '!gh auth git-credential'
          tip="$(git -C "$repo" ls-remote --refs "$remote" "$ref" | cut -f1)"
          if [[ "$tip" != "$HEAD_SHA" ]]; then
            echo "The merged branch is absent or has advanced"
            exit 0
          fi
          git -C "$repo" push --force-with-lease="$ref:$HEAD_SHA" "$remote" ":$ref"
