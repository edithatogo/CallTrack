name: Weekly Android dependency audit
on:
  schedule:
    - cron: '17 19 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+100000002.0.LTS'
      - name: Verify tooling
        run: |
          java -version 2>&1 | grep -F 'Temurin-25.0.5.1+2'
          test -n "$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Check for outdated dependencies
        run: ./gradlew lintDebug -PstrictVersions=true --stacktrace
