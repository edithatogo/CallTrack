# Shared repository privacy baseline. Application dependencies are unchanged.
# Documentation: https://github.com/edithatogo/repository-standards/blob/main/docs/privacy-secrets-standard.md
# The shared action builds Presidio for isolated Python 3.15.2.
# Existing repository-specific privacy and secret checks remain independent.
name: Privacy and secrets

on:
  pull_request:
  push:
    branches: ["main"]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '49 2 * * 4'
  workflow_dispatch:
    inputs:
      profile:
        description: Personal-identifier detection profile
        type: choice
        options:
          - repository
          - sensitive
        default: repository

permissions:
  contents: read

concurrency:
  group: privacy-secrets-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  privacy-and-secrets:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Scan with Presidio and Gitleaks
        uses: edithatogo/repository-standards/.github/actions/privacy-secrets@23fe1fb4f99021b1a721f63dea09a2369ba8845d
        with:
          profile: ${{ inputs.profile || 'repository' }}
