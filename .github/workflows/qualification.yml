name: Build qualification
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Run pinned pre-commit hooks against changed files
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input pre-commit==4.7.0
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z HEAD^ HEAD)
          if (( ${#changed[@]} )); then
            .venv/bin/pre-commit run --files "${changed[@]}"
          fi
      - name: Native Android host policy, regressions and Conductor
        run: |
          test "$(.venv/bin/python --version)" = "Python $(cat .python-version)"
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/verify_conductor.py
