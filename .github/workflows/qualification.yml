name: Build qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Run pinned pre-commit hooks against changed files
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check --no-input pre-commit==4.7.0
          mapfile -d '' -t changed < <(git diff --name-only --diff-filter=ACMR -z HEAD^ HEAD)
          if (( ${#changed[@]} )); then
            .venv/bin/pre-commit run --files "${changed[@]}"
          fi
      - name: Native Android host policy, regressions and Conductor
        run: |
          python -m venv .venv
          test "$(.venv/bin/python --version)" = "Python $(cat .python-version)"
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/verify_conductor.py
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+100000002.0.LTS'
      - name: Verify tooling
        run: |
          java -version 2>&1 | grep -F 'Temurin-25.0.5.1+2'
          test -n "$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.1" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Check Java and Kotlin format
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/2.0.0/google-java-format-2.0.0-all-deps.jar -o .local/toolchain/google-java-format-2.0.0.jar
          echo "c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639  .local/toolchain/google-java-format-2.0.0.jar" | sha256sum --check
          java -jar .local/toolchain/google-java-format-2.0.0.jar --aosp --cleanup=false --dry-run --set-exit-if-changed app/src/*/java/com/markobl/calllogsync/slice/*.java
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/ktfmt/0.65/ktfmt-0.65-with-dependencies.jar -o .local/toolchain/ktfmt-0.65.jar
          echo "aba9753b6ab387926179ab7318ba8e0c33dad483ebc72f633e79522265b15214  .local/toolchain/ktfmt-0.65.jar" | sha256sum --check
          find app/src -type f -name '*.kt' -print0 | xargs -0 java -jar .local/toolchain/ktfmt-0.65.jar --kotlinlang-style --dry-run --set-exit-if-changed
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Build native Android 17 app, tests and lint
        run: |
          python -m venv .venv
          .venv/bin/python scripts/run_slice_build.py --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME"
          sh gradlew --no-daemon --console=plain :app:assembleRelease

  legacy-required-status-alias:
    # GitHub main still requires three obsolete check CONTEXT NAMES. These are
    # aliases for current Android 17 qualification, NOT legacy OS/KMP test runs.
    # Remove after https://github.com/edithatogo/CallTrack/issues/119 updates protection.
    name: ${{ matrix.required_context }}
    needs: [qualification, slice]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        required_context:
          - 'multiplatform-ui'
          - 'qualification (upstream, 11, 32, 30.0.3)'
          - 'qualification (modern, 17, 36, 35.0.0)'
    steps:
      - name: Disclose legacy context alias and assert native prerequisites
        run: |
          set -euo pipefail
          echo 'This is a TEMPORARY GitHub branch protection CONTEXT ALIAS.'
          echo 'It executes no pre-Android17, Java11 upstream or multiplatform code.'
          echo 'Its prerequisite jobs have both passed native Android17 build, JVM tests, lint and Conductor.'
          echo 'Required status contexts must be updated before alias retirement: issue #119.'
