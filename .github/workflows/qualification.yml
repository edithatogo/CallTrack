name: Build qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: upstream
            jdk: '11'
            platform: '32'
            build_tools: '30.0.3'
          - variant: modern
            jdk: '17.0.21+9'
            platform: '36'
            build_tools: '35.0.0'
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.1'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select repository Python runtime
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python_runtime.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Check qualification Java formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar -o .local/toolchain/google-java-format-1.24.0.jar
          echo "812f805f58112460edf01bf202a8e61d0fd1f35c0d4fabd54220640776ec57a1  .local/toolchain/google-java-format-1.24.0.jar" | sha256sum --check
          java -jar .local/toolchain/google-java-format-1.24.0.jar --aosp --dry-run --set-exit-if-changed qualification/src/androidTest/java/com/markobl/calllogsync/PermissionQualificationTest.java
      - name: Install SDK packages with Java 17
        run: sdkmanager "platforms;android-${{ matrix.platform }}" "build-tools;${{ matrix.build_tools }}"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Verify tooling and Conductor
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/verify_conductor.py
      - name: Fetch audited upstream
        run: .venv/bin/python scripts/bootstrap_qualification.py
      - name: Prepare modern qualification
        if: matrix.variant == 'modern'
        run: .venv/bin/python scripts/prepare_qualification.py --modern
      - name: Build and lint
        run: .venv/bin/python scripts/run_qualification.py --variant "${{ matrix.variant }}" --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME" --clean
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.1'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select repository Python runtime
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python_runtime.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Install slice SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Verify local tooling
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: Check slice Java formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar -o .local/toolchain/google-java-format-1.24.0.jar
          echo "812f805f58112460edf01bf202a8e61d0fd1f35c0d4fabd54220640776ec57a1  .local/toolchain/google-java-format-1.24.0.jar" | sha256sum --check
          java -jar .local/toolchain/google-java-format-1.24.0.jar --aosp --dry-run --set-exit-if-changed app/src/*/java/com/markobl/calllogsync/slice/*.java
      - name: Check Kotlin formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/facebook/ktfmt/0.59/ktfmt-0.59-with-dependencies.jar -o .local/toolchain/ktfmt-0.59.jar
          echo "a493271c137074436a133d72e9e323f91604c97e0c40555629ec39598efead54  .local/toolchain/ktfmt-0.59.jar" | sha256sum --check
          rg --files app/src prototypes/compose/src -g '*.kt' -0 | xargs -0 java -jar .local/toolchain/ktfmt-0.59.jar --kotlinlang-style --dry-run --set-exit-if-changed
      - name: Build and verify development slice
        run: .venv/bin/python scripts/run_slice_build.py --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - name: Compile and package unsigned release variant
        run: sh gradlew --no-daemon --console=plain :app:assembleRelease
  compose-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.15.1'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Select repository Python runtime
        run: |
          python -m venv .venv
          .venv/bin/python scripts/verify_python_runtime.py
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17.0.21+9'
      - name: Install prototype SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Build isolated synthetic Compose experiment
        run: .venv/bin/python scripts/qualify_compose_prototype.py build --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME"
