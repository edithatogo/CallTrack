name: Build qualification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: upstream
            jdk: '11'
            platform: '32'
            build_tools: '30.0.3'
          - variant: modern
            jdk: '17'
            platform: '36'
            build_tools: '35.0.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17.0.21+100000002'
      - name: Check qualification Java formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/1.24.0/google-java-format-1.24.0-all-deps.jar -o .local/toolchain/google-java-format-1.24.0.jar
          echo "812f805f58112460edf01bf202a8e61d0fd1f35c0d4fabd54220640776ec57a1  .local/toolchain/google-java-format-1.24.0.jar" | sha256sum --check
          java -jar .local/toolchain/google-java-format-1.24.0.jar --aosp --dry-run --set-exit-if-changed qualification/src/androidTest/java/com/markobl/calllogsync/PermissionQualificationTest.java
      - name: Add Android SDK command-line tools to PATH
        run: |
          python -m venv .venv
          test "$(.venv/bin/python --version)" = "Python $(cat .python-version)"
          test -n "$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
      - name: Install SDK packages with Java 17
        run: sdkmanager "platforms;android-${{ matrix.platform }}" "build-tools;${{ matrix.build_tools }}"
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
      - name: Fetch audited upstream
        run: .venv/bin/python scripts/bootstrap_qualification.py
      - name: Prepare modern qualification
        if: matrix.variant == 'modern'
        run: .venv/bin/python scripts/prepare_qualification.py --modern
      - name: Build and lint
        run: .venv/bin/python scripts/run_qualification.py --variant "${{ matrix.variant }}" --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME" --clean
  slice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+100000002.0.LTS'
      - name: Select repository Python runtime
        run: |
          python -m venv .venv
          test "$(.venv/bin/python --version)" = "Python $(cat .python-version)"
          java -version 2>&1 | grep -F 'Temurin-25.0.5.1+2'
      - name: Add Android SDK command-line tools to PATH
        run: |
          test -n "$ANDROID_HOME"
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          dirname "$sdkmanager_path" >> "$GITHUB_PATH"
      - name: Install slice SDK
        run: sdkmanager "platforms;android-36" "platforms;android-37.1" "build-tools;35.0.0" "build-tools;36.0.0"
      - name: Verify tooling and Conductor
        run: |
          .venv/bin/python -m unittest discover -s tests -v
          .venv/bin/python scripts/verify_conductor.py
      - name: Check slice Java formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/google/googlejavaformat/google-java-format/2.0.0/google-java-format-2.0.0-all-deps.jar -o .local/toolchain/google-java-format-2.0.0.jar
          echo "c78feb48c549fa7114b7ea11db3b456808f7b371ffe84e6643a44dd2f9588639  .local/toolchain/google-java-format-2.0.0.jar" | sha256sum --check
          java -jar .local/toolchain/google-java-format-2.0.0.jar --aosp --cleanup=false --dry-run --set-exit-if-changed app/src/*/java/com/markobl/calllogsync/slice/*.java
      - name: Check Kotlin formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/facebook/ktfmt/0.59/ktfmt-0.59-with-dependencies.jar -o .local/toolchain/ktfmt-0.59.jar
          echo "a493271c137074436a133d72e9e323f91604c97e0c40555629ec39598efead54  .local/toolchain/ktfmt-0.59.jar" | sha256sum --check
          find app/src prototypes/multiplatform-ui/src shared-core/src -type f -name '*.kt' -print0 | xargs -0 java -jar .local/toolchain/ktfmt-0.59.jar --kotlinlang-style --dry-run --set-exit-if-changed
      - name: Build and verify development slice
        run: .venv/bin/python scripts/run_slice_build.py --jdk "$JAVA_HOME" --sdk "$ANDROID_HOME"
      - name: Compile and package unsigned release variant
        run: sh gradlew --no-daemon --console=plain :app:assembleRelease
      - name: Verify shared-core host tests
        run: |
          sh gradlew --no-daemon --console=plain :shared-core:jvmTest :shared-core:testAndroidHostTest
          for result_dir in shared-core/build/test-results/jvmTest shared-core/build/test-results/testAndroidHostTest; do
            test -d "$result_dir"
            reports=$(find "$result_dir" -type f -name 'TEST-*.xml' -print)
            test -n "$reports"
            summaries=$(find "$result_dir" -type f -name 'TEST-*.xml' -exec grep -h '<testsuite' {} +)
            printf '%s\n' "$summaries" | grep -Eq 'tests="[1-9][0-9]*"'
            if printf '%s\n' "$summaries" | grep -Eq '(skipped|failures|errors)="[1-9][0-9]*"'; then exit 1; fi
          done
  multiplatform-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25.0.5+100000002.0.LTS'
      - name: Verify Java runtime
        run: java -version 2>&1 | grep -F 'Temurin-25.0.5.1+2'
      - name: Install the prototype Android SDK
        run: |
          sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-37.0" "build-tools;36.0.0"
      - name: Check multiplatform UI Kotlin formatting
        run: |
          mkdir -p .local/toolchain
          curl --fail --location --silent --show-error https://repo.maven.apache.org/maven2/com/facebook/ktfmt/0.59/ktfmt-0.59-with-dependencies.jar -o .local/toolchain/ktfmt-0.59.jar
          echo "a493271c137074436a133d72e9e323f91604c97e0c40555629ec39598efead54  .local/toolchain/ktfmt-0.59.jar" | sha256sum --check
          find prototypes/multiplatform-ui/src -type f -name '*.kt' -print0 | xargs -0 java -jar .local/toolchain/ktfmt-0.59.jar --kotlinlang-style --dry-run --set-exit-if-changed
      - name: Test headless desktop UI and package JAR
        run: sh gradlew --no-daemon --console=plain --dependency-verification=strict -p prototypes/multiplatform-ui desktopTest desktopJar :android-host:assembleDebug
