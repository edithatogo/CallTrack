// Observe detached tool configurations as well as named application configurations.
def observed = java.util.Collections.synchronizedList(new java.util.ArrayList())
gradle.addListener(new org.gradle.api.artifacts.DependencyResolutionListener() {
    void beforeResolve(org.gradle.api.artifacts.ResolvableDependencies dependencies) { }
    void afterResolve(org.gradle.api.artifacts.ResolvableDependencies dependencies) {
        dependencies.artifactView { view ->
            view.componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        }.artifacts.artifacts.each { artifact ->
            def id = artifact.id.componentIdentifier
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                observed.add([configuration:dependencies.path, coordinate:"${id.group}:${id.module}:${id.version}".toString(),
                    name:artifact.file.name, sha256:java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()])
            }
        }
    }
})
gradle.buildFinished { result ->
    def destination = System.getenv('CALLTRACK_RESOLUTION_TRACE')
    if (destination) new File(destination).text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
        [build_success:result.failure == null, artifacts:observed]))+'\n'
}
