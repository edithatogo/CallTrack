// Local release-source packaging: resolve the actual candidate runtime artifacts.
gradle.projectsEvaluated {
    gradle.rootProject.tasks.register('releaseBundleRuntimeInventory') {
        doLast {
            def config = gradle.rootProject.project(':app').configurations.releaseRuntimeClasspath
            // The release classpath now includes the in-repository KMP shared-core
            // project. Gradle's legacy resolvedArtifacts API tries to select a
            // published artifact variant for that project and is ambiguous across
            // Android artifacts. The source bundle already contains project source;
            // inventory only external Maven components here.
            def rows = config.incoming.artifactView {
                componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
            }.artifacts.artifacts.collect { artifactResult ->
                def component = artifactResult.id.componentIdentifier
                def file = artifactResult.file
                [coordinate: "${component.group}:${component.module}:${component.version}", name: file.name,
                 sha256: java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()]
            }
            new File(System.getenv('CALLTRACK_RUNTIME_OUT')).text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([configuration: config.name, artifacts: rows])) + '\n'
        }
    }
}
