// Local release-source packaging: resolve the actual candidate runtime artifacts.
gradle.projectsEvaluated {
    gradle.rootProject.tasks.register('releaseBundleRuntimeInventory') {
        doLast {
            def config = gradle.rootProject.project(':app').configurations.releaseRuntimeClasspath
            def rows = config.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                [coordinate: artifact.moduleVersion.id.toString(), name: artifact.file.name,
                 sha256: java.security.MessageDigest.getInstance('SHA-256').digest(artifact.file.bytes).encodeHex().toString()]
            }
            new File(System.getenv('CALLTRACK_RUNTIME_OUT')).text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson([configuration: config.name, artifacts: rows])) + '\n'
        }
    }
}
