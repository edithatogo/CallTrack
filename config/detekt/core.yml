config:
  validation: true
  warningsAsErrors: true

Compose:
  active: true
  Material2:
    active: true
  UnstableCollections:
    active: true

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']

complexity:
  # A simple case label adds no work beyond selecting the result.
  CyclomaticComplexMethod:
    ignoreSimpleWhenEntries: true
  # Measure component APIs and keep private helpers and lifecycle overrides outside the count.
  TooManyFunctions:
    ignorePrivate: true
    ignoreOverridden: true
    ignoreAnnotatedFunctions: ['Composable']

style:
  # Keep validation guards at the start of a method.
  ReturnCount:
    excludeGuardClauses: true
  ThrowsCount:
    excludeGuardClauses: true
